name: CI

on:
  push:
  pull_request:

jobs:
  server-build:
    name: Server Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate contracts
        run: npm run contracts:generate

      - name: Determine build version
        run: |
          VERSION=$(node -p "require('./packages/server/package.json').version")
          echo "BUILD_VERSION=${VERSION}+build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building server version ${VERSION}+build.${GITHUB_RUN_NUMBER}"

      - name: Build server
        run: npm run build --workspace superartillery-server

      - name: Test core and server
        run: |
          npm test --workspace @superartillery/core
          npm test --workspace superartillery-server

  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate contracts
        run: npm run contracts:generate

      - name: Determine build version
        run: |
          VERSION=$(node -p "require('./packages/client/package.json').version")
          echo "BUILD_VERSION=${VERSION}+build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building client version ${VERSION}+build.${GITHUB_RUN_NUMBER}"

      - name: Build client
        run: npm run build --workspace superartillery-client

      - name: Test client
        run: npm test --workspace superartillery-client
