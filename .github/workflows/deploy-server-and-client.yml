name: Deploy Server And Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-server:
    name: Deploy Server To Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate contracts
        run: npm run contracts:generate

      - name: Build server
        run: npm run build --workspace superartillery-server

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy server to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: railway up --service "$RAILWAY_SERVICE_ID" --ci

  deploy:
    name: Build And Deploy Client
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate contracts
        run: npm run contracts:generate

      - name: Build client for Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        run: npm run build --workspace superartillery-client

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
